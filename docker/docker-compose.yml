services:
  assistant:
    build: .
    image: agentic-assistant:latest
    container_name: agentic-assistant

    # The confirmation gate calls input(). Without both of these the prompt
    # never appears and the container exits the moment it asks a question.
    stdin_open: true
    tty: true

    environment:
      # host.docker.internal = the Windows host, where Ollama is listening.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      EMBED_BASE_URL: http://host.docker.internal:11434/v1
      QWEN_MODEL: ${QWEN_MODEL:-qwen3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      AGENT_DEBUG: ${AGENT_DEBUG:-0}
      # No browser in here: refuse to start an OAuth flow that would hang
      # forever waiting for a redirect nobody can complete.
      NO_INTERACTIVE_AUTH: "1"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Secrets: mounted, never baked into the image (see .dockerignore).
      # These files MUST already exist on the host or Docker silently creates
      # DIRECTORIES with those names and OAuth fails in a confusing way.
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json                 # writable: refresh rewrites it
      - ./token_calendar.json:/app/token_calendar.json
      # Your data, kept outside the image so it stays private and survives rebuilds.
      - ./notes:/app/notes:ro
      - ./session:/app/session
